<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PropCraft AI</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#0f0e0c;--paper:#f7f4ef;--paper2:#ede9e2;--accent:#d4522a;--border:#d8d3ca;--muted:#8a8478;--white:#fff}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
.app{max-width:720px;margin:0 auto;padding:0 20px 60px}
.header{padding:40px 0 32px;border-bottom:1.5px solid var(--ink);margin-bottom:40px}
.logo{font-family:'Instrument Serif',serif;font-size:30px}
.tag{font-size:10px;font-weight:600;letter-spacing:2px;color:var(--accent);border:1px solid var(--accent);padding:2px 7px;border-radius:2px;margin-right:8px;vertical-align:middle}
.sub{font-size:14px;color:var(--muted);margin-top:8px}
.usage{display:flex;align-items:center;justify-content:space-between;background:var(--paper2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:28px;font-size:13px}
.dots{display:flex;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--border)}
.dot.on{background:var(--accent)}
.lbl{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.blk{margin-bottom:20px}
textarea{width:100%;background:var(--white);border:1.5px solid var(--border);border-radius:8px;padding:13px 15px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);outline:none;resize:vertical;line-height:1.6}
textarea:focus{border-color:var(--ink)}
textarea::placeholder{color:#b8b3aa}
.tones{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{padding:6px 13px;border-radius:100px;border:1.5px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;color:var(--muted)}
.tbtn.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.genbtn{width:100%;padding:15px;border:none;border-radius:8px;background:var(--ink);color:var(--paper);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.genbtn:disabled{opacity:.4;cursor:not-allowed}
.out{margin-top:36px;border-top:1.5px solid var(--ink);padding-top:28px}
.out-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.out-title{font-family:'Instrument Serif',serif;font-size:20px}
.copybtn{padding:7px 13px;border-radius:6px;border:1.5px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer}
.box{background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:24px 28px;font-family:'Instrument Serif',serif;font-size:16px;line-height:1.9;white-space:pre-wrap}
.paywall{background:var(--ink);color:var(--paper);border-radius:12px;padding:36px 28px;text-align:center;margin-top:36px}
.paywall h2{font-family:'Instrument Serif',serif;font-size:24px;margin-bottom:10px}
.paywall p{color:#a09a90;font-size:13px;margin-bottom:20px;line-height:1.7}
.steps{background:#1a1814;border-radius:8px;padding:14px 16px;font-size:12px;color:#a09a90;line-height:2.2;margin-bottom:16px;text-align:left}
.wallet-box{background:#1a1814;border:1px solid #3a3830;border-radius:8px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.wallet-addr{font-family:monospace;font-size:11px;color:#a09a90;word-break:break-all;text-align:left}
.copy-addr{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.tg-link{display:block;background:#1a1814;border:1px solid #2a9d5c;border-radius:8px;padding:12px;color:#2a9d5c;font-size:13px;text-decoration:none;margin-bottom:16px}
.divider{color:#3a3830;margin:16px 0;font-size:12px}
.code-row{display:flex;gap:8px}
.code-input{flex:1;background:#1a1814;border:1px solid #3a3830;border-radius:8px;padding:11px 14px;font-family:monospace;font-size:13px;color:#fff;outline:none}
.code-btn{background:#2a6dd4;color:#fff;border:none;border-radius:8px;padding:11px 18px;font-size:13px;font-weight:600;cursor:pointer}
.cnote{font-size:11px;color:#6b6560;margin-top:12px}
.footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const GROQ_KEY = "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";
const WALLET = "0xEf62bb63Bec2179789F6b2787a771E6Fa410cB27";
const TELEGRAM = "https://t.me/jewelDark";
const FREE_LIMIT = 3;
const VALID_CODES = ["PROP-JUN26","PROP-JUL26","PROP-AUG26"];

const {useState,useEffect,useRef} = React;
const TONES = ["Professional","Friendly","Confident","Creative","Concise"];

function App(){
  const [job,setJob]=useState("");
  const [bg,setBg]=useState("");
  const [tone,setTone]=useState("Professional");
  const [result,setResult]=useState("");
  const [loading,setLoading]=useState(false);
  const [uses,setUses]=useState(0);
  const [unlocked,setUnlocked]=useState(false);
  const [copied,setCopied]=useState(false);
  const [addrCopied,setAddrCopied]=useState(false);
  const [code,setCode]=useState("");
  const [codeErr,setCodeErr]=useState(false);
  const ref=useRef(null);

  useEffect(()=>{
    const u=parseInt(localStorage.getItem("pc_u")||"0");
    const ul=localStorage.getItem("pc_unlocked")==="true";
    setUses(u);
    setUnlocked(ul);
  },[]);

  const locked=!unlocked && uses>=FREE_LIMIT;

  const unlock=()=>{
    if(VALID_CODES.includes(code.trim().toUpperCase())){
      localStorage.setItem("pc_unlocked","true");
      setUnlocked(true);
      alert("✅ Unlocked! You now have unlimited proposals.");
    } else {
      setCodeErr(true);
      setTimeout(()=>setCodeErr(false),2000);
    }
  };

  const gen=async()=>{
    if(!job.trim()||!bg.trim()||locked)return;
    setLoading(true);setResult("");
    const prompt=`Write a compelling ${tone} freelance proposal.\nJob: ${job}\nBackground: ${bg}\nRules: 150-250 words, hook opening, specific examples, CTA. Write ONLY the proposal.`;
    try{
      const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":`Bearer ${GROQ_KEY}`},
        body:JSON.stringify({model:"llama-3.3-70b-versatile",messages:[{role:"user",content:prompt}],max_tokens:600,temperature:0.8})
      });
      const d=await r.json();
      const t=d.choices?.[0]?.message?.content||"Error. Try again.";
      setResult(t.trim());
      if(!unlocked){
        const n=uses+1;
        setUses(n);
        localStorage.setItem("pc_u",n);
      }
      setTimeout(()=>ref.current?.scrollIntoView({behavior:"smooth"}),100);
    }catch(e){setResult("Connection error.");}
    setLoading(false);
  };

  const copyResult=()=>{navigator.clipboard.writeText(result);setCopied(true);setTimeout(()=>setCopied(false),2000)};
  const copyAddr=()=>{navigator.clipboard.writeText(WALLET);setAddrCopied(true);setTimeout(()=>setAddrCopied(false),2000)};

  return(
    <div className="app">
      <div className="header">
        <div><span className="tag">AI</span><span className="logo">PropCraft</span></div>
        <p className="sub">Write winning freelance proposals in seconds.</p>
      </div>

      <div className="usage">
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div className="dots">
            {[0,1,2].map(i=><div key={i} className={`dot${i<uses&&!unlocked?" on":""}`}/>)}
          </div>
          <span style={{color:"var(--muted)",fontSize:13}}>
            {unlocked
              ? <strong style={{color:"#2a9d5c"}}>✓ Unlimited access</strong>
              : <><strong style={{color:"var(--ink)"}}>{Math.max(0,FREE_LIMIT-uses)}</strong> free proposals left</>
            }
          </span>
        </div>
        <span onClick={()=>{setJob("Need a React developer for a SaaS dashboard. Budget $800, 2 weeks.");setBg("5 years React. Built 20+ dashboards. Expert in Recharts, Firebase.");}}
          style={{fontSize:12,color:"#2a6dd4",cursor:"pointer"}}>
          Load example →
        </span>
      </div>

      {!locked&&<>
        <div className="blk">
          <div className="lbl">Job Description</div>
          <textarea rows={5} placeholder="Paste the job post here..." value={job} onChange={e=>setJob(e.target.value)}/>
        </div>
        <div className="blk">
          <div className="lbl">Your Background</div>
          <textarea rows={4} placeholder="Your skills and experience..." value={bg} onChange={e=>setBg(e.target.value)}/>
        </div>
        <div className="blk">
          <div className="lbl">Tone</div>
          <div className="tones">
            {TONES.map(t=><button key={t} className={`tbtn${tone===t?" on":""}`} onClick={()=>setTone(t)}>{t}</button>)}
          </div>
        </div>
        <button className="genbtn" onClick={gen} disabled={loading||!job.trim()||!bg.trim()}>
          {loading?"Writing...":"✦ Generate Proposal"}
        </button>
      </>}

      {(loading||result)&&<div className="out" ref={ref}>
        <div className="out-hd">
          <div className="out-title">Your Proposal</div>
          {result&&<button className="copybtn" onClick={copyResult}>{copied?"✓ Copied!":"Copy"}</button>}
        </div>
        <div className="box">{loading?"Writing your proposal...":result}</div>
      </div>}

      {locked&&<div className="paywall">
        <h2>You've used all 3 free proposals</h2>
        <p>Get unlimited proposals for just $9/month.<br/>Pay with USDT — works worldwide.</p>

        <div className="steps">
          ① Send $9 USDT to the address below (BEP20 network)<br/>
          ② Send your transaction ID to Telegram<br/>
          ③ Receive your unlock code instantly
        </div>

        <div className="wallet-box">
          <span className="wallet-addr">{WALLET}</span>
          <button className="copy-addr" onClick={copyAddr}>
            {addrCopied?"✓ Copied!":"Copy"}
          </button>
        </div>

        <a className="tg-link" href={TELEGRAM} target="_blank">
          📩 Send TX proof → @jewelDark
        </a>

        <div className="divider">— Already have a code? Enter below —</div>

        <div className="code-row">
          <input
            className="code-input"
            placeholder="Enter unlock code..."
            value={code}
            onChange={e=>setCode(e.target.value)}
            style={{borderColor:codeErr?"#d4522a":"#3a3830"}}
          />
          <button className="code-btn" onClick={unlock}>Unlock</button>
        </div>

        <div className="cnote">
          {codeErr?"❌ Invalid code. Try again.":"Network: BEP20 (BSC) · $9 = unlimited access"}
        </div>
      </div>}

      <div className="footer">
        <span>PropCraft © 2026</span>
        <span>Groq AI</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
