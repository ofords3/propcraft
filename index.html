<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PropCraft AI</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#0f0e0c;--paper:#f7f4ef;--paper2:#ede9e2;--accent:#d4522a;--border:#d8d3ca;--muted:#8a8478;--white:#fff}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
.app{max-width:720px;margin:0 auto;padding:0 20px 60px}
.header{padding:40px 0 32px;border-bottom:1.5px solid var(--ink);margin-bottom:40px}
.logo{font-family:'Instrument Serif',serif;font-size:30px}
.tag{font-size:10px;font-weight:600;letter-spacing:2px;color:var(--accent);border:1px solid var(--accent);padding:2px 7px;border-radius:2px;margin-right:8px;vertical-align:middle}
.sub{font-size:14px;color:var(--muted);margin-top:8px}
.usage{display:flex;align-items:center;justify-content:space-between;background:var(--paper2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:28px;font-size:13px}
.dots{display:flex;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--border)}
.dot.on{background:var(--accent)}
.lbl{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.blk{margin-bottom:20px}
textarea{width:100%;background:var(--white);border:1.5px solid var(--border);border-radius:8px;padding:13px 15px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);outline:none;resize:vertical;line-height:1.6}
textarea:focus{border-color:var(--ink)}
textarea::placeholder{color:#b8b3aa}
.tones{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{padding:6px 13px;border-radius:100px;border:1.5px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;color:var(--muted)}
.tbtn.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.genbtn{width:100%;padding:15px;border:none;border-radius:8px;background:var(--ink);color:var(--paper);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.genbtn:disabled{opacity:.4;cursor:not-allowed}
.out{margin-top:36px;border-top:1.5px solid var(--ink);padding-top:28px}
.out-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.out-title{font-family:'Instrument Serif',serif;font-size:20px}
.copybtn{padding:7px 13px;border-radius:6px;border:1.5px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer}
.box{background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:24px 28px;font-family:'Instrument Serif',serif;font-size:16px;line-height:1.9;white-space:pre-wrap}
.paywall{background:var(--ink);color:var(--paper);border-radius:12px;padding:36px 28px;text-align:center;margin-top:36px}
.paywall h2{font-family:'Instrument Serif',serif;font-size:24px;margin-bottom:10px}
.paywall p{color:#a09a90;font-size:13px;margin-bottom:24px;line-height:1.6}
.plans{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.plan{background:#1e1c19;border:1px solid #3a3830;border-radius:10px;padding:18px 24px;cursor:pointer;position:relative}
.plan.sel{border-color:var(--accent)}
.ptag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--accent);font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 9px;border-radius:100px;white-space:nowrap}
.pamt{font-size:26px;font-weight:600;color:#fff}
.punit{font-size:11px;color:#6b6560;margin-top:3px}
.paybtn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:13px 28px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer}
.cnote{font-size:11px;color:#6b6560;margin-top:12px}
.footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const GROQ_KEY = "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";
const PAY_LINK = "https://nowpayments.io";
const FREE_LIMIT = 3;
const {useState,useEffect,useRef} = React;
const TONES = ["Professional","Friendly","Confident","Creative","Concise"];

function App(){
  const [job,setJob]=useState("");
  const [bg,setBg]=useState("");
  const [tone,setTone]=useState("Professional");
  const [result,setResult]=useState("");
  const [loading,setLoading]=useState(false);
  const [uses,setUses]=useState(0);
  const [copied,setCopied]=useState(false);
  const [plan,setPlan]=useState("monthly");
  const ref=useRef(null);

  useEffect(()=>{setUses(parseInt(localStorage.getItem("pc_u")||"0"))},[]);
  const locked=uses>=FREE_LIMIT;

  const gen=async()=>{
    if(!job.trim()||!bg.trim()||locked)return;
    setLoading(true);setResult("");
    const prompt=`Write a compelling ${tone} freelance proposal.\nJob: ${job}\nBackground: ${bg}\nRules: 150-250 words, hook opening, specific examples, CTA. Write ONLY the proposal.`;
    try{
      const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${GROQ_KEY}`},body:JSON.stringify({model:"llama-3.3-70b-versatile",messages:[{role:"user",content:prompt}],max_tokens:600,temperature:0.8})});
      const d=await r.json();
      const t=d.choices?.[0]?.message?.content||"Error. Try again.";
      setResult(t.trim());
      const n=uses+1;setUses(n);localStorage.setItem("pc_u",n);
      setTimeout(()=>ref.current?.scrollIntoView({behavior:"smooth"}),100);
    }catch(e){setResult("Connection error.");}
    setLoading(false);
  };

  const copy=()=>{navigator.clipboard.writeText(result);setCopied(true);setTimeout(()=>setCopied(false),2000)};

  return(
    <div className="app">
      <div className="header">
        <div><span className="tag">AI</span><span className="logo">PropCraft</span></div>
        <p className="sub">Write winning freelance proposals in seconds.</p>
      </div>

      <div className="usage">
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div className="dots">{[0,1,2].map(i=><div key={i} className={`dot${i<uses?" on":""}`}/>)}</div>
          <span style={{color:"var(--muted)",fontSize:13}}><strong style={{color:"var(--ink)"}}>{Math.max(0,FREE_LIMIT-uses)}</strong> free proposals left</span>
        </div>
        <span onClick={()=>{setJob("Need a React developer for a SaaS dashboard. Budget $800, 2 weeks.");setBg("5 years React. Built 20+ dashboards. Expert in Recharts, Firebase.");}} style={{fontSize:12,color:"#2a6dd4",cursor:"pointer"}}>Load example →</span>
      </div>

      {!locked&&<>
        <div className="blk"><div className="lbl">Job Description</div><textarea rows={5} placeholder="Paste the job post here..." value={job} onChange={e=>setJob(e.target.value)}/></div>
        <div className="blk"><div className="lbl">Your Background</div><textarea rows={4} placeholder="Your skills and experience..." value={bg} onChange={e=>setBg(e.target.value)}/></div>
        <div className="blk"><div className="lbl">Tone</div><div className="tones">{TONES.map(t=><button key={t} className={`tbtn${tone===t?" on":""}`} onClick={()=>setTone(t)}>{t}</button>)}</div></div>
        <button className="genbtn" onClick={gen} disabled={loading||!job.trim()||!bg.trim()}>{loading?"Writing...":"✦ Generate Proposal"}</button>
      </>}

      {(loading||result)&&<div className="out" ref={ref}>
        <div className="out-hd">
          <div className="out-title">Your Proposal</div>
          {result&&<button className="copybtn" onClick={copy}>{copied?"✓ Copied!":"Copy"}</button>}
        </div>
        <div className="box">{loading?"Writing your proposal...":result}</div>
      </div>}

      {locked&&<div className="paywall">
        <h2>You've used all 3 free proposals</h2>
        <p>Upgrade to keep winning clients.<br/>Pay with crypto — works worldwide.</p>
        <div className="plans">
          <div className={`plan${plan==="payg"?" sel":""}`} onClick={()=>setPlan("payg")}>{plan==="payg"&&<div className="ptag">Selected</div>}<div className="pamt">$2</div><div className="punit">per proposal</div></div>
          <div className={`plan${plan==="monthly"?" sel":""}`} onClick={()=>setPlan("monthly")}>{plan==="monthly"&&<div className="ptag">Most Popular</div>}<div className="pamt">$9</div><div className="punit">/ month unlimited</div></div>
        </div>
        <button className="paybtn" onClick={()=>window.open(PAY_LINK,"_blank")}>Pay with Crypto →</button>
        <div className="cnote">USDT · BTC · ETH · BNB · SOL</div>
      </div>}

      <div className="footer"><span>PropCraft © 2026</span><span>Groq AI</span></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
